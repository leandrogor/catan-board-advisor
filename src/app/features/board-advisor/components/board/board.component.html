<div class="relative w-full flex items-center justify-center">
  <!-- Simulating overlay: fixed so it always covers the full viewport on mobile too -->
  @if (store.isSimulating()) {
    <div
      class="fixed inset-0 flex items-center justify-center bg-black/50 z-50"
      style="touch-action: none; pointer-events: all"
    >
      <div
        class="flex items-center gap-3 bg-[#faf8f3] dark:bg-slate-800 rounded-full px-6 py-4 shadow-2xl"
      >
        <span class="animate-spin text-2xl">⚙️</span>
        <span class="font-semibold text-slate-900 dark:text-slate-100 text-base">{{
          i18n.t().simulating
        }}</span>
      </div>
    </div>
  }

  <!-- Phase 1 drag hint badge -->
  @if (store.appPhase() === 'setup') {
    <div
      class="absolute top-2 left-1/2 -translate-x-1/2 z-10 pointer-events-none flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-amber-100/90 dark:bg-amber-900/60 text-amber-800 dark:text-amber-200 border border-amber-300 dark:border-amber-700 shadow-sm backdrop-blur-sm"
    >
      🏜️ {{ i18n.t().dragToMove }}
    </div>
  }

  <svg
    class="board-wrapper w-full h-auto"
    [class.setup-phase]="store.appPhase() === 'setup'"
    [attr.viewBox]="viewBox()"
    [style]="rotationStyle()"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    [attr.aria-label]="i18n.t().catanBoardAriaLabel"
  >
    <!-- Hex polygons -->
    @for (hex of store.hexes(); track hex.id) {
      <g>
        <polygon
          [attr.data-hex-id]="hex.id"
          [class]="
            'hex-polygon' +
            (hex.isDesert && store.appPhase() === 'setup' ? ' desert-draggable' : '') +
            (!hex.isDesert && store.appPhase() === 'setup' ? ' hex-clickable' : '') +
            (!hex.isDesert && store.appPhase() === 'results' ? ' hex-clickable' : '') +
            (isDropTarget(hex.id) ? ' drop-target' : '')
          "
          [attr.points]="getPolygonPoints(hex)"
          [attr.fill]="
            hex.isDesert
              ? 'var(--hex-desert-fill, #d4a574)'
              : store.selectedHexId() === hex.id
                ? 'var(--hex-fill-selected, #a78bfa22)'
                : 'var(--hex-fill)'
          "
          [attr.stroke]="
            isDropTarget(hex.id) ? 'var(--color-top-vertex, #f59e0b)' : 'var(--hex-stroke)'
          "
          [attr.stroke-width]="isDropTarget(hex.id) ? '3' : '1.5'"
          [attr.stroke-dasharray]="hex.isDesert && store.appPhase() === 'setup' ? '6 3' : 'none'"
          (click)="onHexClick(hex)"
          (pointerdown)="
            hex.isDesert ? onDesertPointerDown($event, hex.letter === 'L1' ? 'L1' : 'L2') : null
          "
        />

        <!-- Phase 1: letter or dice number display -->
        @if (store.appPhase() === 'setup') {
          @if (hex.isDesert) {
            <text
              [attr.x]="hex.center.x"
              [attr.y]="hex.center.y + 2"
              text-anchor="middle"
              dominant-baseline="middle"
              [attr.font-size]="R() * 0.55"
              [attr.transform]="getTextCounterRotation(hex.center.x, hex.center.y)"
              class="hex-number"
              style="pointer-events: none"
            >
              🏜️
            </text>
          } @else {
            <text
              [attr.x]="hex.center.x"
              [attr.y]="hex.center.y + 2"
              text-anchor="middle"
              dominant-baseline="middle"
              [attr.font-size]="
                store.showNumbersInSetup() ? getNumberFontSize(hex.diceNumber) : R() * 0.42
              "
              [attr.fill]="
                store.showNumbersInSetup() && isHotNumber(hex.diceNumber)
                  ? 'var(--hex-number-hot)'
                  : 'var(--hex-number-default)'
              "
              [attr.font-weight]="
                store.showNumbersInSetup() && isHotNumber(hex.diceNumber) ? 'bold' : 'normal'
              "
              [attr.transform]="getTextCounterRotation(hex.center.x, hex.center.y)"
              class="hex-number"
            >
              {{ getHexPhase1Label(hex) }}
            </text>
          }
        }

        <!-- Phase 2: dice number display -->
        @if (store.appPhase() === 'results' || store.appPhase() === 'game') {
          @if (hex.isDesert) {
            <text
              [attr.x]="hex.center.x"
              [attr.y]="hex.center.y + 2"
              text-anchor="middle"
              dominant-baseline="middle"
              [attr.font-size]="R() * 0.55"
              [attr.transform]="getTextCounterRotation(hex.center.x, hex.center.y)"
              class="hex-number"
            >
              🏜️
            </text>
          } @else {
            <g role="button" tabindex="0">
              <text
                [attr.x]="hex.center.x"
                [attr.y]="hex.center.y + 2"
                text-anchor="middle"
                dominant-baseline="middle"
                [attr.font-size]="getNumberFontSize(hex.diceNumber)"
                [attr.fill]="
                  isHotNumber(hex.diceNumber)
                    ? 'var(--hex-number-hot)'
                    : 'var(--hex-number-default)'
                "
                [attr.font-weight]="isHotNumber(hex.diceNumber) ? 'bold' : 'normal'"
                [attr.transform]="getTextCounterRotation(hex.center.x, hex.center.y)"
                class="hex-number"
              >
                {{ hex.diceNumber }}
                <title>{{ i18n.t().hexLetter }}: {{ hex.letter }}</title>
              </text>
            </g>
          }
        }
      </g>
    }

    <!-- Dedicated Road Layer -->
    <g class="road-layer">
      <!-- Longest Road Highlights (drawn behind all roads to keep them synchronized) -->
      @for (trackRef of [longestRoadTrackKey()]; track trackRef) {
        @if (longestRoadHighlightCoords().length > 0) {
          <g class="longest-road-highlights">
            @for (road of longestRoadHighlightCoords(); track $index) {
              <line
                [attr.x1]="road.p1.x"
                [attr.y1]="road.p1.y"
                [attr.x2]="road.p2.x"
                [attr.y2]="road.p2.y"
                [attr.stroke]="road.colorHex"
                stroke-width="12"
                stroke-linecap="round"
                class="longest-road-glow"
                style="pointer-events: none"
              />
            }
          </g>
        }
      }

      <!-- 1. Placed Roads (persistent thick lines in occupied color with subtle neon aura) -->
      @for (road of placedRoadCoords(); track $index) {
        <line
          [attr.x1]="road.p1.x"
          [attr.y1]="road.p1.y"
          [attr.x2]="road.p2.x"
          [attr.y2]="road.p2.y"
          [attr.stroke]="road.glowColor"
          stroke-width="9"
          stroke-linecap="round"
          class="opacity-60 dark:opacity-80"
          style="pointer-events: none; filter: blur(1.5px)"
        />
        <line
          [attr.x1]="road.p1.x"
          [attr.y1]="road.p1.y"
          [attr.x2]="road.p2.x"
          [attr.y2]="road.p2.y"
          [attr.stroke]="road.colorHex"
          stroke-width="6"
          stroke-linecap="round"
          style="pointer-events: none"
        />
      }

      <!-- Suggested Expansion Roads (dashed line in white/black) -->
      @for (sugRoad of suggestedRoadCoords(); track $index) {
        <line
          [attr.x1]="sugRoad.p1.x"
          [attr.y1]="sugRoad.p1.y"
          [attr.x2]="sugRoad.p2.x"
          [attr.y2]="sugRoad.p2.y"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-dasharray="2,3"
          class="projected-svg-element"
          style="pointer-events: none"
        />
      }

      <!-- 2. Active Selection Road Options & Projection Dashes -->
      @if (store.isSelectingRoad()) {
        @for (sel of activeSelectionOptions(); track sel.opt.toVertexId) {
          <!-- Projected next settlement dashed lines and faint circle -->
          @if (sel.pProj) {
            <!-- Render segment lines -->
            @for (line of sel.projectionLines; track $index) {
              <line
                [attr.x1]="line.x1"
                [attr.y1]="line.y1"
                [attr.x2]="line.x2"
                [attr.y2]="line.y2"
                [attr.stroke]="
                  sel.opt.rank === 1
                    ? 'var(--color-top-vertex, #f59e0b)'
                    : sel.opt.rank === 2
                      ? '#64748b'
                      : '#94a3b8'
                "
                [attr.opacity]="sel.opt.rank === 3 ? 0.35 : 0.55"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-dasharray="4 4"
                style="pointer-events: none"
              />
            }
            <!-- Faint circle marker at projected next settlement -->
            <circle
              [attr.cx]="sel.pProj.x"
              [attr.cy]="sel.pProj.y"
              [attr.r]="8"
              [attr.stroke]="
                sel.opt.rank === 1
                  ? 'var(--color-top-vertex, #f59e0b)'
                  : sel.opt.rank === 2
                    ? '#64748b'
                    : '#94a3b8'
              "
              [attr.fill]="
                sel.opt.rank === 1
                  ? 'var(--color-top-vertex, #f59e0b)'
                  : sel.opt.rank === 2
                    ? '#64748b'
                    : '#94a3b8'
              "
              [attr.opacity]="sel.opt.rank === 3 ? 0.3 : 0.5"
              fill-opacity="0.12"
              stroke-width="1.5"
              stroke-dasharray="2 2"
              style="pointer-events: none"
            />
          }

          <!-- Hit area (generously wide transparent line) placed behind the visible line -->
          <line
            [attr.x1]="sel.p1.x"
            [attr.y1]="sel.p1.y"
            [attr.x2]="sel.p2.x"
            [attr.y2]="sel.p2.y"
            stroke="transparent"
            stroke-width="20"
            stroke-linecap="round"
            class="cursor-pointer"
            (click)="store.confirmRoadSelection(sel.opt.toVertexId)"
            role="button"
            [attr.aria-label]="'Select road direction rank ' + sel.opt.rank"
          />

          <!-- Original rank-colored line (setup/results: initial settlement placement) -->
          <line
            [attr.x1]="sel.p1.x"
            [attr.y1]="sel.p1.y"
            [attr.x2]="sel.p2.x"
            [attr.y2]="sel.p2.y"
            [attr.stroke]="
              sel.opt.rank === 1
                ? 'var(--color-top-vertex, #f59e0b)'
                : sel.opt.rank === 2
                  ? '#64748b'
                  : '#94a3b8'
            "
            [attr.opacity]="sel.opt.rank === 3 ? 0.5 : 1"
            stroke-width="6"
            stroke-linecap="round"
            style="pointer-events: none"
          />

          <!-- Rank Badge at midpoint -->
          @if (sel.midpoint) {
            <g [attr.transform]="'translate(' + sel.midpoint.x + ', ' + sel.midpoint.y + ')'">
              <circle
                cx="0"
                cy="0"
                r="8"
                [attr.fill]="
                  sel.opt.rank === 1
                    ? 'var(--color-top-vertex, #f59e0b)'
                    : sel.opt.rank === 2
                      ? '#64748b'
                      : '#94a3b8'
                "
                [attr.opacity]="sel.opt.rank === 3 ? 0.6 : 1"
                stroke="white"
                stroke-width="1"
                style="pointer-events: none"
              />
              <text
                x="0"
                y="0"
                text-anchor="middle"
                dominant-baseline="central"
                font-size="9"
                font-weight="bold"
                fill="white"
                [attr.transform]="getTextCounterRotation(0, 0)"
                style="pointer-events: none; user-select: none"
              >
                {{ sel.opt.rank }}
              </text>
            </g>
          }
        }
      }
    </g>

    <!-- Vertex indicators (Phase 2 and Game phases) -->
    @if (store.appPhase() === 'results' || store.appPhase() === 'game') {
      <!-- Suggested Target Vertices (Pulsing dashed ring in white/black) -->
      @if (store.appPhase() === 'results' || store.appPhase() === 'game') {
        @for (target of suggestedTargetCoords(); track target.id) {
          <circle
            [attr.cx]="target.pt.x"
            [attr.cy]="target.pt.y"
            [attr.r]="14"
            fill="none"
            stroke-width="1.5"
            stroke-dasharray="2,3"
            class="projected-svg-element animate-pulse"
            style="pointer-events: none"
          />
        }
      }

      @for (vertex of displayVertices(); track vertex.id) {
        <g>
          <!-- Top vertex amber ring -->
          @if (
            isTopVertex(vertex) &&
            !vertex.isOccupied &&
            !vertex.isBlocked &&
            !store.isSelectingRoad() &&
            !store.isSetupComplete()
          ) {
            <circle
              class="top-vertex-ring"
              [attr.cx]="vertex.position.x"
              [attr.cy]="vertex.position.y"
              [attr.r]="getVertexRadius(vertex) + 4"
              fill="none"
              stroke="var(--color-top-vertex)"
              stroke-width="3"
            />
          }

          <!-- Subtle neon glow aura for occupied vertex circle -->
          @if (vertex.isOccupied) {
            @let glow = getVertexGlowColor(vertex);
            @if (glow) {
              <circle
                [attr.cx]="vertex.position.x"
                [attr.cy]="vertex.position.y"
                [attr.r]="getVertexRadius(vertex) + 2"
                [attr.fill]="glow"
                class="opacity-60 dark:opacity-80"
                style="pointer-events: none; filter: blur(1.5px)"
              />
            }
          }

          <!-- Main vertex circle -->
          <circle
            [attr.id]="vertex.id"
            [class]="'vertex-circle' + (vertex.isBlocked ? ' vertex-blocked' : '')"
            [attr.cx]="vertex.position.x"
            [attr.cy]="vertex.position.y"
            [attr.r]="getVertexRadius(vertex)"
            [attr.fill]="getVertexFill(vertex)"
            [attr.opacity]="getVertexOpacity(vertex)"
            [attr.aria-label]="getVertexAriaLabel(vertex)"
            role="button"
            tabindex="0"
            (click)="onVertexClick(vertex)"
            (keydown.enter)="onVertexClick(vertex)"
            (keydown.space)="onVertexClick(vertex)"
          />

          <!-- Selected ring -->
          @if (isSelected(vertex)) {
            <circle
              [attr.cx]="vertex.position.x"
              [attr.cy]="vertex.position.y"
              [attr.r]="getVertexRadius(vertex) + 3"
              fill="none"
              stroke="white"
              stroke-width="2"
            />
          }

          <!-- Top vertex star -->
          @if (
            isTopVertex(vertex) &&
            !vertex.isOccupied &&
            !vertex.isBlocked &&
            !store.isSelectingRoad() &&
            !store.isSetupComplete()
          ) {
            <text
              [attr.x]="vertex.position.x"
              [attr.y]="vertex.position.y - getVertexRadius(vertex) - 8"
              [attr.transform]="getTextCounterRotation(vertex.position.x, vertex.position.y)"
              text-anchor="middle"
              font-size="14"
              fill="var(--color-top-vertex)"
              class="pointer-events-none"
            >
              ★
            </text>
          }

          <!-- Occupied house or city icon -->
          @if (vertex.isOccupied) {
            <text
              [attr.x]="vertex.position.x"
              [attr.y]="vertex.position.y + 4"
              [attr.transform]="getTextCounterRotation(vertex.position.x, vertex.position.y)"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="12"
              class="pointer-events-none"
            >
              {{ store.getSettlementAt(vertex.id)?.type === 'city' ? '🏰' : '🏠' }}
            </text>
          }

          <!-- Rank number for top distinct ranks -->
          @if (
            store.appPhase() === 'results' &&
            vertex.rank &&
            vertex.rank <= thresholdRank() &&
            !vertex.isOccupied &&
            !vertex.isBlocked
          ) {
            <text
              [attr.x]="vertex.position.x"
              [attr.y]="vertex.position.y + 3"
              [attr.transform]="getTextCounterRotation(vertex.position.x, vertex.position.y)"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="8"
              font-weight="bold"
              fill="white"
              class="pointer-events-none"
            >
              {{ vertex.rank }}
            </text>
          }
        </g>
      }
    }

    <!-- Game Phase Build Tool Highlights Layer -->
    @if (store.appPhase() === 'game' && store.activeBuildTool()) {
      <!-- Settlement Spots -->
      @if (store.activeBuildTool() === 'settlement') {
        @for (spot of validSettlementVertices(); track spot.id) {
          <g class="cursor-pointer group" (click)="onBuildSpotClick(spot.id)">
            <!-- Outer pulsing ring -->
            <circle
              [attr.cx]="spot.pt.x"
              [attr.cy]="spot.pt.y"
              fill="none"
              [attr.stroke]="store.currentPlayerColor()?.hex ?? '#10b981'"
              stroke-width="2.5"
              class="build-spot-ping"
              style="pointer-events: none"
            />
            <!-- Inner highlight circle -->
            <circle
              [attr.cx]="spot.pt.x"
              [attr.cy]="spot.pt.y"
              [attr.r]="10"
              fill="#10b981"
              fill-opacity="0.45"
              stroke="#047857"
              stroke-width="1.5"
              class="build-spot-interactive"
            />
          </g>
        }
      }

      <!-- City Spots -->
      @if (store.activeBuildTool() === 'city') {
        @for (spot of validCityVertices(); track spot.id) {
          <g class="cursor-pointer group" (click)="onBuildSpotClick(spot.id)">
            <!-- Outer pulsing ring -->
            <circle
              [attr.cx]="spot.pt.x"
              [attr.cy]="spot.pt.y"
              fill="none"
              [attr.stroke]="store.currentPlayerColor()?.hex ?? '#f59e0b'"
              stroke-width="2.5"
              class="build-spot-ping"
              style="pointer-events: none"
            />
            <!-- Inner highlight circle -->
            <circle
              [attr.cx]="spot.pt.x"
              [attr.cy]="spot.pt.y"
              [attr.r]="12"
              fill="#f59e0b"
              fill-opacity="0.45"
              stroke="#d97706"
              stroke-width="1.5"
              class="city-spot-interactive"
            />
          </g>
        }
      }

      <!-- Road Edges (game phase road build tool) -->
      @if (store.activeBuildTool() === 'road') {
        @for (edge of store.validRoadEdges(); track edge.from + '-' + edge.to) {
          <g class="cursor-pointer group" (click)="onRoadEdgeClick(edge.from, edge.to)">
            <!-- Runway LED lights on hover: brighter on group-hover -->
            @for (dot of getRoadLights(edge.p1, edge.p2); track dot.index + '_' + dot.rowSign) {
              <circle
                [attr.cx]="dot.x"
                [attr.cy]="dot.y"
                r="1.8"
                [attr.fill]="getRunwayColor(store.currentPlayerColor()?.id ?? '')"
                class="runway-dot group-hover:runway-dot-bright"
                [style.animation-delay]="dot.index * 80 + 'ms'"
                style="pointer-events: none"
              />
            }
            <!-- Generous click area (invisible, handles hover + click) -->
            <line
              [attr.x1]="edge.p1.x"
              [attr.y1]="edge.p1.y"
              [attr.x2]="edge.p2.x"
              [attr.y2]="edge.p2.y"
              stroke="transparent"
              stroke-width="20"
              stroke-linecap="round"
            />
          </g>
        }
      }
    }
  </svg>

  <!-- Ghost overlay during desert drag (positioned relative to viewport, outside SVG) -->
  @if (draggingDesert() !== null) {
    <div [style]="ghostStyle()" class="z-50 pointer-events-none">
      <svg
        [attr.width]="ghostWidth()"
        [attr.height]="ghostHeight()"
        [attr.viewBox]="'-' + R() + ' -' + R() + ' ' + R() * 2 + ' ' + R() * 2"
        style="overflow: visible; display: block"
      >
        <circle
          cx="0"
          cy="0"
          [attr.r]="R() * 0.8"
          fill="var(--hex-desert-fill, #d4a574)"
          stroke="var(--color-top-vertex, #f59e0b)"
          stroke-width="2"
          stroke-dasharray="5 3"
          opacity="0.75"
        />
        <text
          x="0"
          y="4"
          text-anchor="middle"
          dominant-baseline="middle"
          [attr.font-size]="R() * 0.5"
          [attr.transform]="'rotate(' + -store.boardRotationDeg() + ', 0, 4)'"
        >
          🏜️
        </text>
      </svg>
    </div>
  }
</div>
