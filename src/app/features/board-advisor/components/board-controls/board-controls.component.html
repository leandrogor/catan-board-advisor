<div
  class="flex items-center justify-between gap-2 px-3 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom,0))] bg-[#faf8f3] dark:bg-slate-900 border-t border-[#e4dccb] dark:border-slate-700 shadow-xl relative z-30"
>
  <div class="flex items-center gap-1.5 shrink-0">
    <button
      class="flex items-center gap-1 px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-colors bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed"
      [disabled]="!canUndo()"
      (click)="store.undo()"
      [attr.aria-label]="i18n.t().undo"
    >
      <span>←</span> <span class="hidden min-[380px]:inline">{{ i18n.t().undo }}</span>
    </button>

    <button
      class="flex items-center gap-1 px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-colors bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed"
      [disabled]="!canRedo()"
      (click)="store.redo()"
      [attr.aria-label]="i18n.t().redo"
    >
      <span class="hidden min-[380px]:inline">{{ i18n.t().redo }}</span> <span>→</span>
    </button>
  </div>

  <button
    class="flex items-center gap-1 px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition-colors bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-200 dark:hover:bg-indigo-800/50 shrink-0"
    (click)="store.rotateBoard()"
    [attr.aria-label]="i18n.t().rotateBoard"
  >
    ⟳ <span class="hidden min-[420px]:inline">{{ i18n.t().rotateBoard }}</span>
    <span class="min-[420px]:hidden"></span>
  </button>

  @if (store.appPhase() !== 'setup') {
    <span
      class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium ml-1 truncate text-right max-w-30 min-[380px]:max-w-none"
    >
      {{ settlementText() }}
    </span>
  }
</div>
